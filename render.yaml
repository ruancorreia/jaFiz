services:
  - type: web
    name: jafiz
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jafiz-db
          property: connectionString

databases:
  - name: jafiz-db
    plan: free
    databaseName: jafiz
    user: jafiz
